name: pet_camera
description: 元宝拍拍 - AI 宠物影像 App（v1 主演示端：Android）
publish_to: 'none'
# 版本号格式 `版本名+构建号`，是**三端唯一的版本来源**（不要另外硬编码）：
#   - iOS：Info.plist 的 CFBundleShortVersionString/CFBundleVersion 分别引用
#     $(FLUTTER_BUILD_NAME)/$(FLUTTER_BUILD_NUMBER)，由 Flutter 从这里生成；
#   - Android：build.gradle.kts 用 flutter.versionName / flutter.versionCode；
#   - 界面：设置页「关于」通过 appVersionProvider 运行时读取（见 app_version.dart）。
#
# **每次发包必须递增 `+N`**，否则装了新版也分辨不出来（iOS 的
# CFBundleVersion 就是它，TestFlight 也不接受重复的构建号）。
# CI 上可以不改这里，用构建参数自动递增：
#   flutter build ipa --build-number=$BUILD_NUMBER
version: 1.1.0+5

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # 状态管理（Spec 锁定 Riverpod 3.x）
  flutter_riverpod: ^3.2.1
  # 短片剪辑：视频预览/播放（Web 用 HTML5 video）
  video_player: ^2.8.0
  # 短片剪辑：选取本地视频/音频文件（Web 返回字节流）
  file_picker: ^8.0.0
  # Native share sheet; browser fallback downloads the real file.
  share_plus: 12.0.2
  # 短片剪辑：配乐播放（与原声叠加）
  audioplayers: ^5.2.0
  # SVG 图标渲染：用于接入 MingCute 图标资源
  flutter_svg: ^2.2.0
  # 旧页面暂时还在使用 Lucide，先保留依赖避免二级页报错。
  lucide_flutter: ^1.25.0
  # 相机插件（切片2：真实取景框 + 快门拍照；Web/Android 双端支持）
  # 0.12.x：新增 setJpegImageQuality（JPEG 质量控制）；修复 dispose 后仍更新值的崩溃。
  camera: ^0.12.1
  # 显式锁定 iOS 相机实现 ≥0.10.3：
  # 0.9.x 在 iOS 16+ 仍用已废弃的 isHighResolutionCaptureEnabled 处理
  # ResolutionPreset.max，在 iPhone 14 Pro Max（48MP HEIF 主摄）上会触发
  # native 崩溃/行为异常（实拍反馈：点快门直接闪退回桌面）。0.10.3 起改用
  # maxPhotoDimensions 并修复 max 档 HEIF 忽略分辨率的问题。
  camera_avfoundation: ^0.10.3+1
  # 端侧推理（LiteRT/TFLite）。当前只用于实时宠物检测（EfficientDet），
  # 物种识别已随「只拍猫」停用（见 default_species_detector_io.create）。
  # 0.12.1 是当前最新版（2025-10），Dart 侧 API 与 0.11.0 兼容，已实测
  # analyze 零 error。注意它**并不解决 iOS 崩溃**：两版的 ios podspec
  # 逐字节相同，iOS 侧仍固定依赖 TensorFlowLiteSwift 2.12.0
  # （换 Dart 包不换 CocoaPods 依赖）。iOS 要恢复端侧推理得换路线
  # （Google 官方 litert 插件），详见 pet_detector_io.isAvailable 的说明。
  # 仅 Android/iOS 可用；Web 构建靠条件导入隔离（default_species_detector_*.dart）。
  tflite_flutter: ^0.12.1
  # 切片D 宠物滤镜：JPEG 编解码 + 像素级后处理。
  # dart:ui 只能编码 PNG（12MP 会到几十 MB，无法上传），必须靠它出 JPEG。
  image: ^4.3.0
  # HTTP 客户端（切片3：AI 写真云端 API 调用）
  http: ^1.2.0
  # 远程图片加载与缓存（种子图外置 COS 后统一走 AppImage 组件）
  cached_network_image: ^3.4.1
  hive_flutter: ^1.1.0
  # 拍摄照片本地持久化（原生端应用文档目录；Web 端条件导入为空实现）。
  path_provider: ^2.1.5
  # 把成片保存到系统相册（Android MediaStore / iOS PhotoKit）。
  gal: ^2.3.1
  # 全站备案号 Footer：点击跳转工信部备案管理系统
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # 种子照片已外置到对象存储（按 SeedConfig 拼 URL），不再打包进安装包。
    # 仅保留示例短片（0.82 MB）随包分发，播放更稳。
    - assets/seed/seed_manifest.json
    # 品牌 Logo 资源。
    - assets/brand/logo.svg
    # 宠物引诱音效（占位素材，由 tools/gen_lure_sounds.py 合成；
    # 拿到实拍录音后同名覆盖即可，App 无需改代码）。
    - assets/sounds/
    # 首页与主导航统一使用 MingCute SVG 图标资源
    - assets/icons/mingcute/
    # 端侧**实时宠物检测**模型（EfficientDet-Lite0 320，4.35MB）：
    # 宠物模式下逐帧检测主体位置，用来驱动追焦与滤镜的主体分区。
    # 来源：google-coral/test_data。
    - assets/models/efficientdet_lite0_320.tflite
    # 端侧**物种识别**的 MobileNetV2 量化版（3.44MB）+ ImageNet 标签表
    # 已随"只拍猫"收敛**移出安装包**（见 default_species_detector_io.create）。
    # 文件仍保留在仓库里：将来扩到狗/兔时，把这两行加回 assets 并把工厂
    # 改回 TieredSpeciesDetector 即可（iOS 端还需先解掉 TFLite native 崩溃）。
    # 品牌字体：这里只当普通资源打包，不在 flutter.fonts 里声明。
    # 声明在 fonts 下时，Flutter Web 会等字体下载完才渲染首帧（3.5 MB 曾拖到
    # 28 秒）；改为运行时 FontLoader 注册后首屏不再被字体阻塞，
    # 见 lib/data/app_font.dart。母版与生成脚本见 tools/font-subset。
    - assets/fonts/NotoSansSC-400.ttf
    - assets/fonts/NotoSansSC-700.ttf
