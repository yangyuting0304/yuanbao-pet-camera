<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="元宝拍拍 - AI 宠物影像 App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="元宝拍拍">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>元宝拍拍</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 启动加载页：在 Flutter 首帧前展示，首帧后由脚本移除。 */
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #FFFFFF;
      color: #000000;
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 4px solid #F7E98B; border-top-color: #FEDE2C;
      animation: spin 0.9s linear infinite;
    }
    #app-loading .txt { font-size: 15px; letter-spacing: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="spinner"></div>
    <div class="txt">元宝拍拍加载中…</div>
  </div>
  <script>
    // Flutter 首帧渲染后移除启动加载层，避免它继续遮挡页面。
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
